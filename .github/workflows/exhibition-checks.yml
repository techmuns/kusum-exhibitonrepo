name: Exhibition checks
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/public-exhibitions.test.mjs
      - run: node --check scripts/publish-public-exhibitions.mjs
