name: Outreach refresh

# Fills missing lead websites, drafts Nishad-style emails, then finds the RIGHT PERSON
# (technical / R&D / operations decision-maker) + a real verified email where free tools can.
# Writes public/data/leads.json (websites) + public/data/outreach.json (drafts & contacts)
# + public/data/research_targets.json (the right-person on each curated target row).
# Manual (with inputs) + weekly cron (Thursdays). Commits only when that data changed.
on:
  workflow_dispatch:
    inputs:
      max:
        description: 'Max companies to process per run (cost cap)'
        required: false
        default: '30'
      priority_only:
        description: 'Only High-priority leads (true/false)'
        required: false
        default: 'false'
  schedule:
    - cron: '0 8 * * 4' # 08:00 UTC every Thursday

permissions:
  contents: write

# Shares the leads-refresh group: this workflow now also writes public/data/leads.json
# (lead websites), so it must not run alongside the other leads.json writers.
concurrency:
  group: leads-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Required for drafting; Firecrawl also powers the website contact fallback.
      BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      # PRIMARY person-search provider (real Google) — unlocks right-person discovery on CI where
      # DuckDuckGo is bot-walled. find-contacts falls back to DDG → Firecrawl when this is absent.
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      # Optional (defaulted in code): region + model fallback chain.
      AWS_REGION: ${{ secrets.AWS_REGION }}
      BEDROCK_MODEL_IDS: ${{ secrets.BEDROCK_MODEL_IDS }}
      # Optional contact-discovery providers (automated, no logins).
      PDL_API_KEY: ${{ secrets.PDL_API_KEY }}
      HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
      SCRAPEDO_API_KEY: ${{ secrets.SCRAPEDO_API_KEY }}
      PROSPEO_API_KEY: ${{ secrets.PROSPEO_API_KEY }}
      REOON_API_KEY: ${{ secrets.REOON_API_KEY }}
      # Tomba (free tier): email finder + verifier. Both headers required; degrades gracefully if unset.
      TOMBA_API_KEY: ${{ secrets.TOMBA_API_KEY }}
      TOMBA_SECRET: ${{ secrets.TOMBA_SECRET }}
      MAX: ${{ github.event.inputs.max || '30' }}
      PRIORITY_ONLY: ${{ github.event.inputs.priority_only || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Find missing websites (graceful without Firecrawl)
        run: node scripts/find-websites.mjs

      # Find the right person FIRST so the drafted email greets them (not a stale/old contact).
      - name: Find the right person + email (graceful without provider keys)
        run: node scripts/find-contacts.mjs

      - name: Draft emails (graceful without Bedrock)
        run: node scripts/draft-emails.mjs

      - name: Commit & push if changed
        run: |
          if [ -z "$(git status --porcelain public/data/leads.json public/data/outreach.json public/data/research_targets.json)" ]; then
            echo "No changes to leads/outreach/research data — nothing to commit."
            exit 0
          fi
          git config user.name "kgr-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/update-meta.mjs
          git add public/data/leads.json public/data/outreach.json public/data/research_targets.json public/data/meta.json
          git commit -m "chore(data): refresh websites, drafts & right-person contacts"

          branch="${GITHUB_REF_NAME}"
          for i in 1 2 3 4; do
            if git pull --rebase origin "$branch" && git push origin "HEAD:$branch"; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed; retrying in $((2**i))s..."
            sleep $((2**i))
          done
          echo "Failed to push after retries." >&2
          exit 1
