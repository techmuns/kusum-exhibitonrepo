name: Complete exhibition publication
on:
  workflow_run:
    workflows: [Exhibition checks]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
concurrency:
  group: exhibition-publication-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  finalize:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact-head CI and review gates using trusted main code
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-public-exhibitions.mjs --finalize
