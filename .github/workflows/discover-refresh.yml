name: Discover exhibitions
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: discover-refresh
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rotate direct public calendars and organiser dates
        run: node scripts/refresh-public-exhibitions.mjs
      - run: node scripts/update-meta.mjs
      - run: node --test scripts/public-exhibitions.test.mjs
      - name: Publish through a checked data pull request
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-public-exhibitions.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exhibition-source-receipts
          path: public/data/exhibition-checks.json
          retention-days: 30
